server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large document uploads (PDFs, scanned P&IDs, etc). Default
    # nginx limit is 1MB, which silently rejects anything bigger.
    client_max_body_size 500M;
    client_body_timeout 300s;

    # Proxy all API calls to the FastAPI backend container.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Stream the request body straight through instead of buffering
        # the whole upload in nginx first — keeps memory flat regardless
        # of file size and starts forwarding to the backend immediately.
        proxy_request_buffering off;
    }

    # SPA fallback: any other route serves index.html so React Router
    # can handle client-side routing (e.g. refreshing on /documents).
    location / {
        try_files $uri /index.html;
    }
}
